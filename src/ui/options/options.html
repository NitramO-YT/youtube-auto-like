<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="optionsPageTitle">YouTube Auto Like</title>
<script src="../boot.js"></script>
<link rel="stylesheet" href="options.css">
</head>
<body>
<header class="options-head">
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 21h4V9H2v12zm20-11a2 2 0 0 0-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L13.2 1 6.6 7.6c-.4.4-.6.9-.6 1.4v10a2 2 0 0 0 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7v-2z"/></svg></span>
  <h1 data-i18n="optionsTitle"></h1>
  <button type="button" class="switch" id="enabled" role="switch" aria-checked="false" data-i18n-aria-label="switchLabel" disabled>
    <span id="enabled-state"></span><span class="track" aria-hidden="true"></span>
  </button>
</header>

<div class="paused-banner" id="paused-banner" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  <span data-i18n="pausedBanner"></span>
</div>

<div class="options-body">
  <nav id="nav" data-i18n-aria-label="navSections">
    <a href="#channels" data-i18n="navChannels"></a>
    <a href="#videos" data-i18n="navVideos"></a>
    <a href="#when" data-i18n="navWhen"></a>
    <a href="#lists" data-i18n="navLists"></a>
    <a href="#history" data-i18n="navHistory"></a>
    <a href="#more" data-i18n="navMore"></a>
    <a href="#about" data-i18n="navAbout"></a>
  </nav>

  <main id="form">
    <section class="block" id="channels" aria-labelledby="channels-heading">
      <h2 id="channels-heading" data-i18n="channelsHeading"></h2>
      <p class="hint" data-i18n="channelsHint"></p>
      <div class="choices" role="radiogroup" aria-labelledby="channels-heading">
        <label class="choice">
          <input type="radio" name="likeWhat" value="subscribed" data-field="likeWhat">
          <span class="radio" aria-hidden="true"></span>
          <span><strong><span data-i18n="likeWhatSubscribed"></span> <span class="badge" data-i18n="recommended"></span></strong><span class="choice-hint" data-i18n="likeWhatSubscribedHint"></span></span>
        </label>
        <label class="choice">
          <input type="radio" name="likeWhat" value="all" data-field="likeWhat">
          <span class="radio" aria-hidden="true"></span>
          <span><strong data-i18n="likeWhatAll"></strong><span class="choice-hint" data-i18n="likeWhatAllHint"></span></span>
        </label>
        <label class="choice">
          <input type="radio" name="likeWhat" value="alwaysList" data-field="likeWhat">
          <span class="radio" aria-hidden="true"></span>
          <span><strong data-i18n="likeWhatList"></strong><span class="choice-hint" data-i18n="likeWhatListHint"></span></span>
        </label>
      </div>
    </section>

    <section class="block" id="videos" aria-labelledby="videos-heading">
      <h2 id="videos-heading" data-i18n="videosHeading"></h2>
      <p class="hint" data-i18n="videosHint"></p>
      <div class="checks">
        <label class="check"><input type="checkbox" data-field="likeNormalVideos"><span class="box" aria-hidden="true"></span><span data-i18n="likeNormalVideos"></span></label>
        <label class="check"><input type="checkbox" data-field="likeShorts"><span class="box" aria-hidden="true"></span><span data-i18n="likeShorts"></span></label>
      </div>
    </section>

    <section class="block" id="when" aria-labelledby="when-heading">
      <h2 id="when-heading" data-i18n="whenHeading"></h2>
      <p class="hint" data-i18n="whenHint"></p>
      <div class="seg" role="radiogroup" aria-labelledby="when-heading">
        <label><input type="radio" name="timingMode" value="instant" data-field="timingMode"><span data-i18n="modeInstant"></span></label>
        <label><input type="radio" name="timingMode" value="custom" data-field="timingMode"><span data-i18n="modeCustom"></span></label>
        <label><input type="radio" name="timingMode" value="random" data-field="timingMode"><span data-i18n="modeRandom"></span></label>
      </div>
      <div class="delays" id="delays" hidden>
        <div class="delay">
          <label class="check"><input type="checkbox" id="percent-enabled" data-field="percentEnabled"><span class="box" aria-hidden="true"></span><span data-i18n="thresholdAfter"></span></label>
          <input type="range" min="0" max="100" step="1" data-mirror="percentValue" data-i18n-aria-label="percentLabel">
          <input type="number" min="0" max="100" step="1" data-field="percentValue" data-i18n-aria-label="percentLabel">
          <span data-i18n="thresholdPercentUnit"></span>
        </div>
        <div class="delay">
          <label class="check"><input type="checkbox" id="minutes-enabled" data-field="minutesEnabled"><span class="box" aria-hidden="true"></span><span data-i18n="thresholdAfter"></span></label>
          <input type="number" min="0" max="600" step="0.5" data-field="minutesValue" data-i18n-aria-label="minutesLabel">
          <span data-i18n="thresholdMinutesUnit"></span>
        </div>
        <p class="hint" id="threshold-lock" data-i18n="thresholdKeepOne" hidden></p>
        <p class="hint" data-i18n="thresholdsHint"></p>
      </div>
      <p class="hint random-hint" id="random-hint" data-i18n="randomHint" hidden></p>
      <div class="relike">
        <label class="check"><input type="checkbox" data-field="relikeAfterRemoval"><span class="box" aria-hidden="true"></span><span data-i18n="relikeLabel"></span></label>
        <p class="hint" data-i18n="relikeHint"></p>
      </div>
      <p class="summary"><strong data-i18n="summaryLabel"></strong> <span id="summary"></span></p>
    </section>

    <section class="block" id="lists" aria-labelledby="lists-heading">
      <h2 id="lists-heading" data-i18n="listsHeading"></h2>
      <p class="hint" data-i18n="listsHint"></p>
      <div class="tabs" role="tablist" aria-labelledby="lists-heading">
        <button type="button" role="tab" id="tab-always" data-list="always" aria-controls="list-panel" aria-selected="true"><span data-i18n="listAlways"></span><span class="count" id="count-always"></span></button>
        <button type="button" role="tab" id="tab-never" data-list="never" aria-controls="list-panel" aria-selected="false" tabindex="-1"><span data-i18n="listNever"></span><span class="count" id="count-never"></span></button>
        <button type="button" role="tab" id="tab-videos" data-list="videos" aria-controls="list-panel" aria-selected="false" tabindex="-1"><span data-i18n="listVideos"></span><span class="count" id="count-videos"></span></button>
      </div>
      <div class="list-tools">
        <input class="search" type="search" id="list-search" data-i18n-placeholder="listSearch" data-i18n-aria-label="listSearch">
        <button type="button" class="btn primary" id="add-channels" data-dialog="add" data-i18n="addChannels"></button>
        <button type="button" class="btn" id="import" data-dialog="import" data-i18n="listImport"></button>
        <button type="button" class="btn" id="export" data-dialog="export" data-i18n="listExport"></button>
      </div>
      <div id="list-panel" role="tabpanel" aria-labelledby="tab-always">
        <ul class="rows" id="list-rows"></ul>
        <div class="list-empty" id="list-empty" hidden>
          <p id="list-empty-text"></p>
          <button type="button" class="btn" id="list-empty-add" data-dialog="add" data-i18n="addChannels"></button>
        </div>
        <div class="more-row" id="list-more" hidden><span id="list-more-count"></span><span class="more-buttons"><button type="button" class="btn" id="list-more-button"></button><button type="button" class="btn" id="list-all-button"></button></span></div>
      </div>
    </section>

    <section class="block" id="history" aria-labelledby="history-heading">
      <h2 id="history-heading" data-i18n="historyHeading"></h2>
      <p class="hint" id="history-hint"></p>
      <ul class="rows" id="history-rows"></ul>
      <p class="list-empty" id="history-empty" data-i18n="historyEmpty" hidden></p>
      <div class="more-row" id="history-more" hidden><span id="history-more-count"></span><span class="more-buttons"><button type="button" class="btn" id="history-more-button"></button><button type="button" class="btn" id="history-all-button"></button></span></div>
      <div class="section-tools"><button type="button" class="btn" id="history-clear" data-i18n="historyClear"></button></div>
    </section>

    <section class="block" id="more" aria-labelledby="more-heading">
      <h2 id="more-heading" data-i18n="moreHeading"></h2>
      <div class="row-toggle">
        <span id="theme-label" data-i18n="themeLabel"></span>
        <div class="seg compact" role="radiogroup" aria-labelledby="theme-label">
          <label><input type="radio" name="theme" value="system" data-field="theme"><span data-i18n="themeSystem"></span></label>
          <label><input type="radio" name="theme" value="light" data-field="theme"><span data-i18n="themeLight"></span></label>
          <label><input type="radio" name="theme" value="dark" data-field="theme"><span data-i18n="themeDark"></span></label>
        </div>
      </div>
      <div class="row-toggle">
        <label for="language"><span data-i18n="languageLabel"></span><span class="hint" data-i18n="languageHint"></span></label>
        <select class="select" id="language" data-field="language"></select>
      </div>
      <div class="row-toggle">
        <label for="list-page-size"><span data-i18n="listPageSizeLabel"></span><span class="hint" data-i18n="listPageSizeHint"></span></label>
        <select class="select" id="list-page-size" data-field="listPageSize">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="0" data-i18n="listPageSizeAll"></option>
        </select>
      </div>
      <div class="row-toggle">
        <label for="update-every"><span data-i18n="updatesLabel"></span><span class="hint" data-i18n="updatesHint"></span></label>
        <div class="frequency">
          <select class="select" id="update-every">
            <option value="0" data-i18n="updateEvery0"></option>
            <option value="30" data-i18n="updateEvery30"></option>
            <option value="60" data-i18n="updateEvery60"></option>
            <option value="360" data-i18n="updateEvery360"></option>
            <option value="1440" data-i18n="updateEvery1440"></option>
            <option value="10080" data-i18n="updateEvery10080"></option>
            <option value="custom" data-i18n="updateEveryCustom"></option>
          </select>
          <span class="frequency-custom" id="update-custom" hidden>
            <span data-i18n="updateEveryPrefix"></span>
            <input class="number" type="number" id="update-custom-count" min="1" step="1" data-i18n-aria-label="updateCustomCount">
            <select class="select" id="update-custom-unit" data-i18n-aria-label="updateCustomUnit">
              <option value="1"></option>
              <option value="60"></option>
              <option value="1440"></option>
            </select>
          </span>
        </div>
      </div>
      <div class="row-toggle">
        <p class="update-line" role="status"><span id="update-status"></span><a id="update-status-link" target="_blank" rel="noopener noreferrer" hidden></a></p>
        <button type="button" class="btn" id="update-check" data-i18n="updateCheckNow"></button>
      </div>
      <div class="row-toggle">
        <div><span id="like-count"></span><span class="hint" data-i18n="likeCountHint"></span></div>
        <button type="button" class="btn" id="reset-count" data-i18n="likeCountReset"></button>
      </div>
      <div class="row-toggle">
        <div>
          <label class="check"><input type="checkbox" data-field="debug"><span class="box" aria-hidden="true"></span><span data-i18n="debugLabel"></span></label>
          <p class="hint debug-hint" data-i18n="debugHint"></p>
        </div>
      </div>
      <div class="row-toggle" id="journal-row" hidden>
        <span id="journal-count"></span>
        <span class="more-buttons">
          <button type="button" class="btn" id="journal-copy" data-i18n="journalCopy"></button>
          <button type="button" class="btn" id="journal-clear" data-i18n="journalClear"></button>
        </span>
      </div>
    </section>

    <section class="block" id="about" aria-labelledby="about-heading">
      <h2 id="about-heading" data-i18n="aboutHeading"></h2>
      <p class="hint" id="about-version"></p>
      <dl class="credits">
        <dt data-i18n="aboutBy"></dt>
        <dd><a href="https://github.com/NitramO-YT" target="_blank" rel="noopener noreferrer">Martin (NitramO)</a></dd>
        <dt data-i18n="aboutOrigin"></dt>
        <dd><a href="https://github.com/austencm/youtube-auto-like" target="_blank" rel="noopener noreferrer">Austen Morgan, austencm/youtube-auto-like</a></dd>
        <dt data-i18n="aboutFirefox"></dt>
        <dd><a href="https://github.com/Taknok/youtube-auto-like" target="_blank" rel="noopener noreferrer">Taknok, Taknok/youtube-auto-like</a></dd>
        <dt data-i18n="aboutLicense"></dt>
        <dd><a id="about-license" target="_blank" rel="noopener noreferrer">MIT</a></dd>
      </dl>
      <p class="hint" data-i18n="aboutInvite"></p>
      <div class="more-buttons">
        <a class="btn" id="about-repository" target="_blank" rel="noopener noreferrer" data-i18n="aboutRepository"></a>
        <button type="button" class="btn" data-dialog="report" data-i18n="reportOpen"></button>
      </div>
    </section>
  </main>
</div>

<!-- "Add channels": links, @handles or video links, looked up on YouTube. -->
<dialog class="dialog" id="add-dialog" aria-labelledby="add-title">
  <h2 id="add-title" data-i18n="addChannels"></h2>
  <p class="hint" data-i18n="addHint"></p>
  <label class="field" for="add-lines" data-i18n="addLinesLabel"></label>
  <textarea class="text-area" id="add-lines" rows="6" spellcheck="false" autocomplete="off" data-i18n-placeholder="addLinesPlaceholder"></textarea>
  <div class="field" id="add-target-label" data-i18n="addTargetLabel"></div>
  <div class="seg compact" role="radiogroup" aria-labelledby="add-target-label">
    <label><input type="radio" name="add-target" value="always" checked><span data-i18n="listAlways"></span></label>
    <label><input type="radio" name="add-target" value="never"><span data-i18n="listNever"></span></label>
  </div>
  <div class="dialog-report" id="add-report" aria-live="polite" hidden>
    <p class="dialog-status" id="add-status"></p>
    <ul class="lookup-rows" id="add-results"></ul>
  </div>
  <div class="dialog-actions">
    <button type="button" class="btn" data-close data-i18n="dialogCancel"></button>
    <button type="button" class="btn" id="add-search" data-i18n="addSearch"></button>
    <button type="button" class="btn primary" id="add-apply" disabled></button>
  </div>
</dialog>

<!-- "Import": an export of the extension or a list of links, analysed before it is applied. -->
<dialog class="dialog" id="import-dialog" aria-labelledby="import-title">
  <h2 id="import-title" data-i18n="importTitle"></h2>
  <p class="hint" data-i18n="importHint"></p>
  <div class="drop-zone" id="import-source">
    <div id="import-source-empty">
      <p><span data-i18n="importDropHere"></span> <button type="button" class="link" id="import-browse" data-i18n="importBrowse"></button></p>
      <p class="hint" data-i18n="importPasteHint"></p>
    </div>
    <div class="drop-filled" id="import-source-filled" hidden>
      <div><strong id="import-source-name"></strong><span class="hint" id="import-source-detail"></span></div>
      <button type="button" class="btn" id="import-source-change" data-i18n="importChange"></button>
      <button type="button" class="btn" id="import-source-remove" data-i18n="importRemove"></button>
    </div>
    <p class="error-text" id="import-source-error" role="alert" hidden></p>
    <input type="file" id="import-file" accept="application/json,.json,text/plain,.txt" hidden>
  </div>
  <fieldset class="dialog-fieldset" id="import-parts" hidden>
    <legend data-i18n="importPartsLabel"></legend>
    <div class="checks">
      <label class="check"><input type="checkbox" name="import-part" value="always"><span class="box" aria-hidden="true"></span><span id="import-part-always"></span></label>
      <label class="check"><input type="checkbox" name="import-part" value="never"><span class="box" aria-hidden="true"></span><span id="import-part-never"></span></label>
      <label class="check"><input type="checkbox" name="import-part" value="videos"><span class="box" aria-hidden="true"></span><span id="import-part-videos"></span></label>
    </div>
  </fieldset>
  <fieldset class="dialog-fieldset" id="import-links-target" hidden>
    <legend data-i18n="importLinksTarget"></legend>
    <div class="seg compact">
      <label><input type="radio" name="import-target" value="always" checked><span data-i18n="listAlways"></span></label>
      <label><input type="radio" name="import-target" value="never"><span data-i18n="listNever"></span></label>
    </div>
  </fieldset>
  <fieldset class="dialog-fieldset">
    <legend data-i18n="importModeLabel"></legend>
    <div class="choices">
      <label class="choice"><input type="radio" name="import-mode" value="add-new"><span class="radio" aria-hidden="true"></span><span><strong data-i18n="importModeAddNew"></strong><span class="choice-hint" data-i18n="importModeAddNewHint"></span></span></label>
      <label class="choice"><input type="radio" name="import-mode" value="follow"><span class="radio" aria-hidden="true"></span><span><strong data-i18n="importModeFollow"></strong><span class="choice-hint" data-i18n="importModeFollowHint"></span></span></label>
      <label class="choice"><input type="radio" name="import-mode" value="replace"><span class="radio" aria-hidden="true"></span><span><strong data-i18n="importModeReplace"></strong><span class="choice-hint" data-i18n="importModeReplaceHint"></span></span></label>
    </div>
    <label class="check remember"><input type="checkbox" id="import-remember"><span class="box" aria-hidden="true"></span><span data-i18n="importRemember"></span></label>
  </fieldset>
  <div class="dialog-report" id="import-report" aria-live="polite" hidden>
    <p class="dialog-status" id="import-status"></p>
    <ul class="report-lines" id="import-lines"></ul>
    <ul class="lookup-rows" id="import-failures"></ul>
    <label class="check danger" id="import-confirm-row" hidden><input type="checkbox" id="import-confirm"><span class="box" aria-hidden="true"></span><span id="import-confirm-text"></span></label>
  </div>
  <div class="dialog-actions">
    <button type="button" class="btn" data-close data-i18n="dialogCancel"></button>
    <button type="button" class="btn" id="import-analyse" data-i18n="dialogAnalyse"></button>
    <button type="button" class="btn primary" id="import-apply" data-i18n="importApply" disabled></button>
  </div>
</dialog>

<!-- "Export": the lists chosen, as a file of the extension or a list of links. -->
<dialog class="dialog" id="export-dialog" aria-labelledby="export-title">
  <h2 id="export-title" data-i18n="exportTitle"></h2>
  <fieldset class="dialog-fieldset">
    <legend data-i18n="exportPartsLabel"></legend>
    <div class="checks">
      <label class="check"><input type="checkbox" name="export-part" value="always" checked><span class="box" aria-hidden="true"></span><span id="export-part-always"></span></label>
      <label class="check"><input type="checkbox" name="export-part" value="never" checked><span class="box" aria-hidden="true"></span><span id="export-part-never"></span></label>
      <label class="check"><input type="checkbox" name="export-part" value="videos" checked><span class="box" aria-hidden="true"></span><span id="export-part-videos"></span></label>
    </div>
  </fieldset>
  <fieldset class="dialog-fieldset">
    <legend data-i18n="exportFormatLabel"></legend>
    <div class="choices">
      <label class="choice"><input type="radio" name="export-format" value="json" checked><span class="radio" aria-hidden="true"></span><span><strong data-i18n="exportFormatJson"></strong><span class="choice-hint" data-i18n="exportFormatJsonHint"></span></span></label>
      <label class="choice"><input type="radio" name="export-format" value="links"><span class="radio" aria-hidden="true"></span><span><strong data-i18n="exportFormatLinks"></strong><span class="choice-hint" data-i18n="exportFormatLinksHint"></span></span></label>
    </div>
  </fieldset>
  <p class="error-text" id="export-error" role="alert" hidden></p>
  <div class="dialog-actions">
    <button type="button" class="btn" data-close data-i18n="dialogCancel"></button>
    <button type="button" class="btn primary" id="export-download" data-i18n="exportDownload"></button>
  </div>
</dialog>

<!-- "Report a problem": the report to attach to an issue on GitHub. -->
<dialog class="dialog" id="report-dialog" aria-labelledby="report-title">
  <h2 id="report-title" data-i18n="reportOpen"></h2>
  <p class="hint" data-i18n="reportHint"></p>
  <label class="check" id="report-journal-row"><input type="checkbox" id="report-journal"><span class="box" aria-hidden="true"></span><span id="report-journal-label"></span></label>
  <p class="hint" id="report-debug-off" data-i18n="reportDebugOff" hidden></p>
  <label class="field" for="report-text" data-i18n="reportTextLabel"></label>
  <textarea class="text-area" id="report-text" rows="10" readonly spellcheck="false"></textarea>
  <p class="dialog-status" id="report-status" role="status" hidden></p>
  <div class="dialog-actions">
    <button type="button" class="btn" data-close data-i18n="dialogClose"></button>
    <button type="button" class="btn" id="report-copy" data-i18n="reportCopy"></button>
    <a class="btn primary" id="report-issue" target="_blank" rel="noopener noreferrer" data-i18n="reportIssue"></a>
  </div>
</dialog>

<div class="notice toast" id="notice" role="status" hidden>
  <span id="notice-text"></span>
  <button type="button" id="notice-undo" data-i18n="noticeUndo" hidden></button>
</div>

<script src="options.js"></script>
</body>
</html>
